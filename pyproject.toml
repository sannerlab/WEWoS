[build-system]
requires = ["setuptools>=64"]   # 64: editable installs (pip install -e)
build-backend = "setuptools.build_meta"

[project]
name = "wewos"
dynamic = ["version"]
description = "WEWoS, the Web Enabled Workflow System: MGLTools Vision's visual programming in a web browser"
readme = "README.md"
requires-python = ">=3.7"
license = {file = "LICENSE.md"}
authors = [{name = "Michel F. Sanner"}]
dependencies = [
    "numpy",
    "fissix; python_version >= '3.13'",   # lib2to3, for importing Vision networks
]

[project.optional-dependencies]
imaging = ["Pillow"]
plots = ["matplotlib"]
all = ["Pillow", "matplotlib"]
# The Molecules library (MolKit2, the Sanner lab's ProDy, mslib) and isocontouring
# (UTpackages), Linux x86_64, Python 3.10 to 3.13: this extra has what they need from PyPI;
# the packages themselves come from the Sanner lab's index only (some of their names belong to
# other projects on PyPI), see the README:
#   pip install --no-deps --index-url https://sannerlab.github.io/pip/py3/ molkit2==0.0.7 ...
# On Python 3.7 they come with the ADCP distribution's adcpsuite environment.
molecules = [
    "biopython; python_version >= '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "scipy; python_version >= '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mmtf-python; python_version >= '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "openbabel-wheel>=3.1.1; python_version >= '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
wewos = "wewos.__main__:main"

[project.urls]
Homepage = "https://sannerlab.github.io/software/wewos/"
License = "https://sannerlab.github.io/software/license.html"

[tool.setuptools.dynamic]
version = {attr = "wewos.__version__"}

[tool.setuptools.packages.find]
include = ["wewos*"]

[tool.setuptools.package-data]
wewos = ["static/*", "symserv/LICENSE", "volcore/LICENSE"]
